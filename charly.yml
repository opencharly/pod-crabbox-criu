# pod-crabbox-criu — the checkpoint/restore lease image for the Crabbox
# containerd provider.
#
# One repo per image (W5.2). The image imports the base lease image at a PINNED
# tag, so the image tag and the git tag name the same build:
# ghcr.io/opencharly/pod-crabbox-criu:<tag> is the tree tagged <tag>.
repo: github.com/opencharly/pod-crabbox-criu
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
import:
    - cachyos: '@github.com/opencharly/distro-cachyos:v2026.300.1129'
    - crabbox: '@github.com/opencharly/pod-crabbox:v2026.307.1828'
discover:
    - path: candy
      recursive: true

pod-crabbox-criu:
    candy:
        description: |
            The CRIU lease image for a Crabbox `containerd` lease: the base
            `pod-crabbox` contract (sshd on 2222, user `crabbox` with passwordless
            sudo, the read-only `/crabbox` inputs, the readiness hook) with `criu`
            installed so a lease can checkpoint and restore its own processes.
            Composes `opencharly/layer-criu` at a pinned tag; that layer owns the
            binary, its version probe, and the `criu check --unprivileged
            --feature seccomp_suspend` pre-flight (a runtime probe of the host
            kernel and the namespace the daemon runs in, so it is not a build fact).
        base: crabbox.pod-crabbox
        # PID 1 is the base image's `sshd -D`, which must run as root; the LOGIN
        # user stays `crabbox` (uid 1000), created by the inherited candy.
        user: root
        uid: 0
        gid: 0
        candy:
            - '@github.com/opencharly/layer-criu:v2026.307.1914'
